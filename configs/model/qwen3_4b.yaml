# ══════════════════════════════════════════════════════════════════════════════
# Vasudha Qwen3-4B Model Configuration
# ══════════════════════════════════════════════════════════════════════════════
# Architecture matching Qwen3-4B (4.02B parameters, dense backbone)
# Enhanced with Vasudha's hybrid attention and sparse MoE.
#
# Colab T4 memory estimates:
#   - fp16 dense loading: ~8GB VRAM
#   - 4-bit QLoRA:        ~3.5GB VRAM (base) + ~0.5GB (LoRA adapters)
#   - Full fine-tune fp16: NOT recommended on T4 (OOM)

# ── HuggingFace base model (source for conversion) ─────────────────────────────
hf_model_name: "Qwen/Qwen3-4B"

# ── Converted Vasudha checkpoint (what training actually loads) ────────────────
# Produced by scripts/convert_qwen3_to_vasudha.py. Training loads from disk so
# bitsandbytes can quantize Vasudha itself; converting in-process would need
# ~14.5GB of CPU RAM to hold the fp32 model and OOM-kills a free Colab VM.
vasudha_path: null

# ── Vasudha architecture ───────────────────────────────────────────────────────
vasudha_config:
  model_type: vasudha
  vocab_size: 151936

  # Core dimensions (matching Qwen3-4B)
  hidden_size: 2560
  intermediate_size: 9728
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128

  # Position embeddings
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  rope_scaling: null

  # Normalization
  rms_norm_eps: 1.0e-6
  attention_bias: false
  qk_norm: true            # Qwen3 innovation — per-head QK normalization

  # ── Hybrid Attention (3:1 GLA:GQA) ─────────────────────────────────────────
  # Pattern repeats: layers 0,1,2 → GLA; layer 3 → Full GQA; etc.
  attention_type: hybrid
  hybrid_pattern:
    - gla        # Layer 0: Gated Linear Attention
    - gla        # Layer 1: Gated Linear Attention
    - gla        # Layer 2: Gated Linear Attention
    - sdpa       # Layer 3: Full GQA (PyTorch SDPA)
  sliding_window_size: 4096  # Used if sliding_window type is selected

  # ── Sparse MoE (every other layer) ─────────────────────────────────────────
  # Odd layers (1, 3, 5, ..., 35) use MoE FFN
  # Even layers (0, 2, 4, ..., 34) use dense SwiGLU FFN
  use_moe: true
  num_experts: 8              # 8 experts for upcycling
  num_experts_per_tok: 2      # Top-2 routing (default)
  moe_intermediate_size: 1216 # 9728 / 8 = 1216 for perfect upcycling
  moe_layers: null            # null = auto (every other layer)

  # Router losses
  router_aux_loss_coef: 0.001   # Load balancing loss weight
  router_z_loss_coef: 0.0001    # Z-loss weight (prevents router collapse)
  router_jitter_noise: 0.0      # Add noise during training for exploration
  expert_capacity_factor: 1.25  # 25% overflow buffer

  # ── Adaptive routing (optional) ─────────────────────────────────────────────
  use_adaptive_routing: false   # Enable for dynamic k selection
  adaptive_routing_min_k: 1
  adaptive_routing_max_k: 4

  # ── Reasoning controller (optional) ─────────────────────────────────────────
  use_reasoning_controller: false

  # ── Output ──────────────────────────────────────────────────────────────────
  tie_word_embeddings: false
  initializer_range: 0.02
  use_cache: true

  # Special tokens (Qwen3)
  bos_token_id: 151643
  eos_token_id: 151645
  pad_token_id: null
